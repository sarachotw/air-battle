<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>哥哥空戰大作戰</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
  background:#061322;
  touch-action:none;
}

#gameWrap{
  position:relative;
  width:100%;
  height:100%;
  max-width:600px;
  margin:auto;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#topBar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:12px;
  color:white;
  z-index:5;
  pointer-events:none;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}

.barBox{
  height:15px;
  margin-top:6px;
  border-radius:20px;
  border:2px solid rgba(255,255,255,.8);
  background:rgba(0,0,0,.35);
  overflow:hidden;
}

#bossHp{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ffd54f,#ff3d5a);
}

#message{
  position:absolute;
  top:112px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  color:white;
  font-size:24px;
  font-weight:1000;
  text-shadow:0 3px 8px #000;
  z-index:8;
  pointer-events:none;
}

#soundBtn{
  position:absolute;
  right:12px;
  top:78px;
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.4);
  color:white;
  font-size:21px;
  z-index:10;
}

#controls{
  position:absolute;
  left:0;
  bottom:18px;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 18px;
  z-index:9;
}

.moveGroup{
  display:flex;
  gap:10px;
}

.ctrl{
  width:68px;
  height:68px;
  border:0;
  border-radius:50%;
  color:white;
  background:rgba(15,28,47,.78);
  font-size:27px;
  font-weight:900;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.45),
    0 5px 12px rgba(0,0,0,.35);
  touch-action:none;
}

#shootBtn{
  width:84px;
  height:84px;
  background:rgba(240,65,65,.94);
  font-size:17px;
}

.ctrl:active{
  transform:scale(.92);
}

.screen{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  background:rgba(4,14,30,.93);
}

.panel{
  width:min(92%,430px);
  padding:25px 20px;
  border-radius:28px;
  text-align:center;
  color:white;
  background:#112f4e;
  border:3px solid rgba(255,255,255,.65);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.panel h1{
  margin:0 0 10px;
  font-size:30px;
}

.panel p{
  line-height:1.7;
}

.broPreview{
  width:120px;
  height:120px;
  object-fit:cover;
  display:block;
  border-radius:50%;
  border:5px solid white;
  margin:14px auto;
}

.startBtn{
  border:0;
  border-radius:18px;
  padding:14px 27px;
  margin-top:10px;
  background:#ffd34e;
  color:#493000;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 5px 0 #c99100;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="gameWrap">

<canvas id="game"></canvas>

<div id="topBar">

  <div class="infoRow">
    <span id="levelText">第 1 關 / 5</span>
    <span id="weaponText">🔫 單發</span>
  </div>

  <div class="infoRow" style="margin-top:5px">
    <span id="playerHpText">❤️❤️❤️❤️❤️</span>
    <span id="shieldText"></span>
  </div>

  <div style="margin-top:7px;font-weight:900;text-shadow:0 2px 5px #000;">
    👦 哥哥
  </div>

  <div class="barBox">
    <div id="bossHp"></div>
  </div>

</div>

<button id="soundBtn">🔊</button>

<div id="message"></div>

<div id="controls">

  <div class="moveGroup">
    <button class="ctrl" id="leftBtn">◀</button>
    <button class="ctrl" id="rightBtn">▶</button>
  </div>

  <button class="ctrl" id="shootBtn">🔥射擊</button>

</div>


<div id="startScreen" class="screen">

  <div class="panel">

    <h1>✈️ 哥哥空戰大作戰</h1>

    <img src="IMG_5927.jpeg" class="broPreview">

    <p>
      駕駛小戰鬥機挑戰哥哥！
    </p>

    <p>
      一共有 <b>5 關</b><br>
      哥哥會反擊，還會丟陷阱！
    </p>

    <p>
      🔥 子彈可以打爆陷阱<br>
      ⭐ 武器升級<br>
      ❤️ 補血<br>
      🛡️ 護盾
    </p>

    <button class="startBtn" id="startBtn">
      開始戰鬥！
    </button>

  </div>

</div>


<div id="gameOverScreen" class="screen hidden">

  <div class="panel">

    <h1>💥 戰鬥機墜落！</h1>

    <img src="IMG_5927.jpeg" class="broPreview">

    <p>哥哥這次贏了 😏</p>

    <button class="startBtn" id="retryBtn">
      再挑戰
    </button>

  </div>

</div>


<div id="winScreen" class="screen hidden">

  <div class="panel">

    <h1>🏆 全部過關！</h1>

    <img src="IMG_5927.jpeg" class="broPreview">

    <h2>哥哥投降啦！🤣</h2>

    <p>
      五關全部完成！<br>
      你成為最強空戰高手！
    </p>

    <button class="startBtn" id="againBtn">
      再玩一次
    </button>

  </div>

</div>

</div>


<script>

/* ==============================
   CANVAS
============================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}

window.addEventListener("resize",resize);
resize();


/* ==============================
   哥哥照片
============================== */

const brotherImg=new Image();
brotherImg.src="IMG_5927.jpeg";


/* ==============================
   音效
============================== */

let audioCtx=null;
let soundOn=true;

function unlockAudio(){

  if(!audioCtx){

    const AudioContext=
      window.AudioContext ||
      window.webkitAudioContext;

    audioCtx=new AudioContext();

  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

}

function tone(
  frequency,
  duration,
  type="square",
  volume=.12,
  endFrequency=null
){

  if(!soundOn)return;

  unlockAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;

  osc.frequency.setValueAtTime(
    frequency,
    now
  );

  if(endFrequency){

    osc.frequency.linearRampToValueAtTime(
      endFrequency,
      now+duration
    );

  }

  gain.gain.setValueAtTime(
    volume,
    now
  );

  gain.gain.linearRampToValueAtTime(
    0.001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration);

}

function soundShoot(){
  tone(800,.06,"square",.06,400);
}

function soundHit(){
  tone(220,.07,"square",.08,120);
}

function soundPlayerHit(){
  tone(160,.28,"sawtooth",.15,60);
}

function soundExplosion(){
  tone(110,.3,"sawtooth",.13,35);
}

function soundReward(){

  tone(650,.1,"sine",.12,900);

  setTimeout(()=>{
    tone(900,.14,"sine",.12,1300);
  },90);

}

function soundShield(){
  tone(350,.18,"sine",.12,900);
}

function soundClear(){

  [523,659,784,1047].forEach(
    (n,i)=>{

      setTimeout(()=>{
        tone(n,.2,"square",.1);
      },i*130);

    }
  );

}

function soundWin(){

  [523,659,784,1047,1319].forEach(
    (n,i)=>{

      setTimeout(()=>{
        tone(n,.3,"sine",.12);
      },i*150);

    }
  );

}

document.addEventListener(
  "pointerdown",
  unlockAudio,
  {once:true}
);

document.addEventListener(
  "touchstart",
  unlockAudio,
  {once:true}
);


/* ==============================
   遊戲資料
============================== */

let running=false;
let level=1;

let player;
let boss;

let bullets=[];
let enemyBullets=[];
let traps=[];
let rewards=[];
let particles=[];
let clouds=[];

let lastTime=0;

let shootTimer=0;
let enemyShootTimer=0;
let trapTimer=0;
let rewardTimer=0;

let leftPressed=false;
let rightPressed=false;
let shootPressed=false;


/* ==============================
   UI
============================== */

const levelText=
document.getElementById("levelText");

const weaponText=
document.getElementById("weaponText");

const playerHpText=
document.getElementById("playerHpText");

const shieldText=
document.getElementById("shieldText");

const bossHpBar=
document.getElementById("bossHp");

const message=
document.getElementById("message");

const startScreen=
document.getElementById("startScreen");

const gameOverScreen=
document.getElementById("gameOverScreen");

const winScreen=
document.getElementById("winScreen");


/* ==============================
   PLAYER
============================== */

function makePlayer(){

  return{

    x:W/2,
    y:H-130,

    speed:280,

    hp:5,
    maxHp:5,

    shield:0,

    weapon:1,

    invincible:0

  };

}


/* ==============================
   BOSS
============================== */

function makeBoss(){

  const hp=
    20+
    level*15;

  return{

    x:W/2,
    y:125,

    hp:hp,
    maxHp:hp,

    speed:
      55+
      level*20,

    dir:1,

    invincible:0,

    flash:0

  };

}


/* ==============================
   BACKGROUND CLOUDS
============================== */

function initClouds(){

  clouds=[];

  for(let i=0;i<8;i++){

    clouds.push({

      x:Math.random()*W,
      y:Math.random()*H,

      scale:
        .5+
        Math.random(),

      speed:
        8+
        Math.random()*18

    });

  }

}


/* ==============================
   START GAME
============================== */

function startGame(){

  unlockAudio();

  level=1;

  player=makePlayer();

  bullets=[];
  enemyBullets=[];
  traps=[];
  rewards=[];
  particles=[];

  initClouds();

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  winScreen.classList.add("hidden");

  startLevel();

  running=true;

  lastTime=performance.now();

  requestAnimationFrame(gameLoop);

}


/* ==============================
   START LEVEL
============================== */

function startLevel(){

  bullets=[];
  enemyBullets=[];
  traps=[];
  rewards=[];

  boss=makeBoss();

  player.x=W/2;
  player.y=H-130;

  player.invincible=1;

  shootTimer=0;
  enemyShootTimer=900;
  trapTimer=1200;
  rewardTimer=4000;

  showMessage(
    "✈️ 第 "+level+" 關！",
    1300
  );

  updateUI();

}


/* ==============================
   UI
============================== */

function updateUI(){

  levelText.textContent=
    "第 "+level+" 關 / 5";

  const weapons=[
    "",
    "🔫 單發",
    "🔫 雙發",
    "🔥 三連發",
    "⚡ 快速炮",
    "💥 散彈炮"
  ];

  weaponText.textContent=
    weapons[player.weapon];

  let hp="";

  for(let i=0;i<player.maxHp;i++){

    hp+=
      i<player.hp
      ? "❤️"
      : "🖤";

  }

  playerHpText.textContent=hp;

  shieldText.textContent=
    player.shield>0
    ? "🛡️ × "+player.shield
    : "";

  bossHpBar.style.width=
    Math.max(
      0,
      boss.hp/boss.maxHp*100
    )+"%";

}


/* ==============================
   MESSAGE
============================== */

function showMessage(text,time=900){

  message.textContent=text;

  setTimeout(()=>{

    if(message.textContent===text){
      message.textContent="";
    }

  },time);

}


/* ==============================
   SHOOT
============================== */

function createBullet(x,y,vx,vy){

  bullets.push({
    x,
    y,
    vx,
    vy,
    r:4
  });

}

function shoot(){

  if(!running)return;

  soundShoot();

  const speed=550;

  if(player.weapon===1){

    createBullet(
      player.x,
      player.y-28,
      0,
      -speed
    );

  }

  else if(player.weapon===2){

    createBullet(
      player.x-10,
      player.y-25,
      0,
      -speed
    );

    createBullet(
      player.x+10,
      player.y-25,
      0,
      -speed
    );

  }

  else if(player.weapon===3){

    createBullet(
      player.x,
      player.y-28,
      0,
      -speed
    );

    createBullet(
      player.x-10,
      player.y-25,
      -55,
      -speed
    );

    createBullet(
      player.x+10,
      player.y-25,
      55,
      -speed
    );

  }

  else if(player.weapon===4){

    createBullet(
      player.x-7,
      player.y-28,
      0,
      -650
    );

    createBullet(
      player.x+7,
      player.y-28,
      0,
      -650
    );

  }

  else{

    [-2,-1,0,1,2].forEach(n=>{

      createBullet(
        player.x,
        player.y-28,
        n*90,
        -570
      );

    });

  }

}


/* ==============================
   哥哥反擊
============================== */

function enemyShoot(){

  const dx=
    player.x-boss.x;

  const dy=
    player.y-boss.y;

  const len=
    Math.hypot(dx,dy);

  const speed=
    160+
    level*28;

  enemyBullets.push({

    x:boss.x,
    y:boss.y+42,

    vx:
      dx/len*speed,

    vy:
      dy/len*speed,

    r:7

  });


  if(level>=3){

    enemyBullets.push({

      x:boss.x-18,
      y:boss.y+38,

      vx:-75,
      vy:speed,

      r:6

    });

    enemyBullets.push({

      x:boss.x+18,
      y:boss.y+38,

      vx:75,
      vy:speed,

      r:6

    });

  }


  if(level===5){

    enemyBullets.push({

      x:boss.x,
      y:boss.y+40,

      vx:-150,
      vy:speed*.85,

      r:7

    });

    enemyBullets.push({

      x:boss.x,
      y:boss.y+40,

      vx:150,
      vy:speed*.85,

      r:7

    });

  }

}


/* ==============================
   陷阱
============================== */

function makeTrap(){

  let types=["💣"];

  if(level>=2){
    types=["💣","🪨"];
  }

  if(level>=3){
    types=["💣","🪨","🚀"];
  }

  if(level>=4){
    types=["💣","🪨","🚀","⚡"];
  }

  const icon=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  let hp=1;

  if(icon==="🚀"){
    hp=2;
  }

  if(icon==="🪨"){
    hp=3;
  }

  if(icon==="⚡"){
    hp=2;
  }

  traps.push({

    icon,

    x:
      30+
      Math.random()*
      (W-60),

    y:-30,

    vx:
      icon==="🚀"
      ? (Math.random()-.5)*100
      : 0,

    vy:
      105+
      level*24+
      Math.random()*55,

    r:
      icon==="🪨"
      ? 20
      : 16,

    hp:hp

  });

}


/* ==============================
   獎勵
============================== */

function makeReward(){

  const random=Math.random();

  let type;

  if(random<.45){
    type="weapon";
  }

  else if(random<.72){
    type="heart";
  }

  else{
    type="shield";
  }

  rewards.push({

    type,

    x:
      35+
      Math.random()*
      (W-70),

    y:-30,

    vy:85,

    r:20

  });

}


/* ==============================
   PLAYER HIT
============================== */

function hitPlayer(){

  if(player.invincible>0){
    return;
  }

  if(player.shield>0){

    player.shield--;

    player.invincible=.8;

    soundShield();

    showMessage(
      "🛡️ 護盾擋住了！"
    );

    updateUI();

    return;

  }

  player.hp--;

  player.invincible=1.1;

  soundPlayerHit();

  makeExplosion(
    player.x,
    player.y
  );

  updateUI();

  if(player.hp<=0){
    gameOver();
  }

}


/* ==============================
   BOSS HIT
============================== */

function bossHit(x,y){

  if(boss.invincible>0){
    return;
  }

  boss.hp--;

  boss.flash=.08;

  soundHit();

  smallParticles(x,y);

  updateUI();

  if(boss.hp<=0){
    clearLevel();
  }

}


/* ==============================
   CLEAR LEVEL
============================== */

function clearLevel(){

  running=false;

  makeExplosion(
    boss.x,
    boss.y
  );

  soundExplosion();

  if(level===5){

    setTimeout(()=>{

      soundWin();

      winScreen
      .classList
      .remove("hidden");

    },700);

    return;

  }

  soundClear();

  showMessage(
    "🎉 第 "+level+" 關突破！",
    1700
  );

  level++;

  if(player.weapon<5){
    player.weapon++;
  }

  if(player.hp<player.maxHp){
    player.hp++;
  }

  setTimeout(()=>{

    startLevel();

    running=true;

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

  },1800);

}


/* ==============================
   GAME OVER
============================== */

function gameOver(){

  running=false;

  soundExplosion();

  setTimeout(()=>{

    gameOverScreen
    .classList
    .remove("hidden");

  },500);

}


/* ==============================
   COLLISION
============================== */

function circleHit(a,b,ar,br){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return(
    dx*dx+dy*dy <
    (ar+br)*(ar+br)
  );

}


/* ==============================
   PARTICLES
============================== */

function makeExplosion(x,y){

  for(let i=0;i<28;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*250,

      vy:
        (Math.random()-.5)*250,

      life:
        .5+
        Math.random()*.5,

      size:
        3+
        Math.random()*7

    });

  }

}

function smallParticles(x,y){

  for(let i=0;i<7;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*100,

      vy:
        (Math.random()-.5)*100,

      life:.25,

      size:
        2+
        Math.random()*3

    });

  }

}


/* ==============================
   UPDATE
============================== */

function update(dt){

  clouds.forEach(c=>{

    c.y+=c.speed*dt;

    if(c.y>H+80){

      c.y=-80;
      c.x=Math.random()*W;

    }

  });


  if(player.invincible>0){
    player.invincible-=dt;
  }

  if(boss.invincible>0){
    boss.invincible-=dt;
  }

  if(boss.flash>0){
    boss.flash-=dt;
  }


  if(leftPressed){
    player.x-=player.speed*dt;
  }

  if(rightPressed){
    player.x+=player.speed*dt;
  }


  player.x=
    Math.max(
      27,
      Math.min(
        W-27,
        player.x
      )
    );


  shootTimer-=dt*1000;

  let shootDelay=250;

  if(player.weapon===4){
    shootDelay=125;
  }

  if(shootPressed && shootTimer<=0){

    shoot();

    shootTimer=shootDelay;

  }


  boss.x+=
    boss.speed*
    boss.dir*
    dt;


  if(boss.x<55){

    boss.x=55;
    boss.dir=1;

  }

  if(boss.x>W-55){

    boss.x=W-55;
    boss.dir=-1;

  }


  if(level>=3){

    boss.y=
      125+
      Math.sin(
        performance.now()/500
      )*22;

  }


  enemyShootTimer-=dt*1000;

  if(enemyShootTimer<=0){

    enemyShoot();

    enemyShootTimer=
      Math.max(
        400,
        1200-level*140
      );

  }


  trapTimer-=dt*1000;

  if(trapTimer<=0){

    makeTrap();

    trapTimer=
      Math.max(
        420,
        1450-level*165
      );

  }


  rewardTimer-=dt*1000;

  if(rewardTimer<=0){

    makeReward();

    rewardTimer=
      5200+
      Math.random()*2500;

  }


  bullets.forEach(b=>{

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

  });


  enemyBullets.forEach(b=>{

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

  });


  traps.forEach(t=>{

    t.x+=t.vx*dt;
    t.y+=t.vy*dt;

  });


  rewards.forEach(r=>{

    r.y+=r.vy*dt;

  });


  particles.forEach(p=>{

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.life-=dt;

  });


  /* ==========================
     ★ 子彈打陷阱
  ========================== */

  bullets.forEach(b=>{

    traps.forEach(t=>{

      if(
        b.dead ||
        t.dead
      ){
        return;
      }

      if(
        circleHit(
          b,
          t,
          b.r,
          t.r
        )
      ){

        b.dead=true;

        t.hp--;

        soundHit();

        smallParticles(
          t.x,
          t.y
        );


        if(t.hp<=0){

          t.dead=true;

          makeExplosion(
            t.x,
            t.y
          );

          soundExplosion();

          showMessage(
            "💥 陷阱擊破！",
            350
          );


          /*
            15% 機率
            打爆陷阱掉獎勵
          */

          if(Math.random()<.15){

            rewards.push({

              type:
                Math.random()<.5
                ? "heart"
                : "weapon",

              x:t.x,

              y:t.y,

              vy:70,

              r:20

            });

          }

        }

      }

    });

  });


  /* ==========================
     子彈打哥哥
  ========================== */

  bullets.forEach(b=>{

    if(b.dead)return;

    if(
      circleHit(
        b,
        boss,
        b.r,
        43
      )
    ){

      b.dead=true;

      bossHit(
        b.x,
        b.y
      );

    }

  });


  /* ==========================
     哥哥子彈打玩家
  ========================== */

  enemyBullets.forEach(b=>{

    if(
      circleHit(
        b,
        player,
        b.r,
        20
      )
    ){

      b.dead=true;

      hitPlayer();

    }

  });


  /* ==========================
     陷阱撞玩家
  ========================== */

  traps.forEach(t=>{

    if(
      !t.dead &&
      circleHit(
        t,
        player,
        t.r,
        21
      )
    ){

      t.dead=true;

      makeExplosion(
        t.x,
        t.y
      );

      soundExplosion();

      hitPlayer();

    }

  });


  /* ==========================
     撿獎勵
  ========================== */

  rewards.forEach(r=>{

    if(
      circleHit(
        r,
        player,
        r.r,
        22
      )
    ){

      r.dead=true;


      if(r.type==="heart"){

        if(player.hp<player.maxHp){
          player.hp++;
        }

        soundReward();

        showMessage(
          "❤️ 補血！"
        );

      }


      if(r.type==="shield"){

        player.shield=
          Math.min(
            3,
            player.shield+1
          );

        soundShield();

        showMessage(
          "🛡️ 獲得護盾！"
        );

      }


      if(r.type==="weapon"){

        if(player.weapon<5){

          player.weapon++;

          soundReward();

          showMessage(
            "⭐ 武器升級！"
          );

        }

        else{

          soundReward();

          showMessage(
            "🔥 火力 MAX！"
          );

        }

      }

      updateUI();

    }

  });


  bullets=
    bullets.filter(
      b=>
        !b.dead &&
        b.y>-50 &&
        b.x>-50 &&
        b.x<W+50
    );


  enemyBullets=
    enemyBullets.filter(
      b=>
        !b.dead &&
        b.y<H+60 &&
        b.x>-60 &&
        b.x<W+60
    );


  traps=
    traps.filter(
      t=>
        !t.dead &&
        t.y<H+60
    );


  rewards=
    rewards.filter(
      r=>
        !r.dead &&
        r.y<H+60
    );


  particles=
    particles.filter(
      p=>p.life>0
    );

}


/* ==============================
   BACKGROUND
============================== */

function drawBackground(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );


  if(level===1){

    g.addColorStop(0,"#0b3767");
    g.addColorStop(1,"#a8e7ff");

  }

  else if(level===2){

    g.addColorStop(0,"#34495e");
    g.addColorStop(1,"#9cc7d8");

  }

  else if(level===3){

    g.addColorStop(0,"#272b4f");
    g.addColorStop(1,"#778caf");

  }

  else if(level===4){

    g.addColorStop(0,"#071630");
    g.addColorStop(1,"#243b69");

  }

  else{

    g.addColorStop(0,"#210818");
    g.addColorStop(1,"#8a2834");

  }


  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.fillStyle=
    "rgba(255,255,255,.4)";


  clouds.forEach(c=>{

    ctx.beginPath();

    ctx.arc(
      c.x,
      c.y,
      22*c.scale,
      0,
      Math.PI*2
    );

    ctx.arc(
      c.x+24*c.scale,
      c.y+5,
      17*c.scale,
      0,
      Math.PI*2
    );

    ctx.arc(
      c.x-24*c.scale,
      c.y+7,
      15*c.scale,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}


/* ==============================
   PLAYER
============================== */

function drawPlayer(){

  if(
    player.invincible>0 &&
    Math.floor(
      performance.now()/80
    )%2===0
  ){
    return;
  }


  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  /* 飛機本體 */

  ctx.fillStyle="#eef5fa";

  ctx.beginPath();

  ctx.moveTo(0,-28);
  ctx.lineTo(10,15);
  ctx.lineTo(0,27);
  ctx.lineTo(-10,15);

  ctx.closePath();
  ctx.fill();


  /* 機翼 */

  ctx.fillStyle="#42a5f5";

  ctx.beginPath();

  ctx.moveTo(-7,5);
  ctx.lineTo(-31,19);
  ctx.lineTo(-7,17);

  ctx.closePath();
  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(7,5);
  ctx.lineTo(31,19);
  ctx.lineTo(7,17);

  ctx.closePath();
  ctx.fill();


  /* 駕駛艙 */

  ctx.fillStyle="#263238";

  ctx.beginPath();

  ctx.ellipse(
    0,
    -7,
    5,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* 火焰 */

  ctx.fillStyle="#ff9800";

  ctx.beginPath();

  ctx.moveTo(-5,24);
  ctx.lineTo(
    0,
    38+Math.random()*8
  );
  ctx.lineTo(5,24);

  ctx.fill();


  /* 玩家護盾 */

  if(player.shield>0){

    ctx.strokeStyle=
      "rgba(80,230,255,.9)";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      34,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* ==============================
   BOSS
============================== */

function drawBoss(){

  ctx.save();

  ctx.translate(
    boss.x,
    boss.y
  );


  ctx.save();

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    43,
    0,
    Math.PI*2
  );

  ctx.clip();


  if(
    brotherImg.complete &&
    brotherImg.naturalWidth>0
  ){

    ctx.drawImage(
      brotherImg,
      -45,
      -45,
      90,
      90
    );

  }


  if(boss.flash>0){

    ctx.fillStyle=
      "rgba(255,255,255,.55)";

    ctx.fillRect(
      -45,
      -45,
      90,
      90
    );

  }


  ctx.restore();


  ctx.strokeStyle="white";
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    45,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.textAlign="center";

  ctx.font=
    "bold 17px sans-serif";

  ctx.lineWidth=4;

  ctx.strokeStyle="black";
  ctx.fillStyle="white";


  const text=
    level===5
    ? "👑 哥哥 BOSS"
    : "哥哥";


  ctx.strokeText(
    text,
    0,
    67
  );

  ctx.fillText(
    text,
    0,
    67
  );


  ctx.restore();

}


/* ==============================
   BULLETS
============================== */

function drawBullets(){

  ctx.shadowBlur=10;
  ctx.shadowColor="#fff176";
  ctx.fillStyle="#ffeb3b";


  bullets.forEach(b=>{

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  ctx.shadowBlur=0;

  ctx.fillStyle="#ff3d00";


  enemyBullets.forEach(b=>{

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      b.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

}


/* ==============================
   TRAPS
============================== */

function drawTraps(){

  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="31px sans-serif";


  traps.forEach(t=>{

    ctx.fillText(
      t.icon,
      t.x,
      t.y
    );

  });

}


/* ==============================
   REWARDS
============================== */

function drawRewards(){

  rewards.forEach(r=>{

    ctx.save();

    ctx.translate(
      r.x,
      r.y
    );


    ctx.fillStyle=
      "rgba(255,255,255,.92)";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      23,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font="26px sans-serif";


    if(r.type==="weapon"){
      ctx.fillText("⭐",0,1);
    }

    if(r.type==="heart"){
      ctx.fillText("❤️",0,1);
    }

    if(r.type==="shield"){
      ctx.fillText("🛡️",0,1);
    }


    ctx.restore();

  });

}


/* ==============================
   PARTICLES
============================== */

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle=
      p.life>.35
      ? "#ffd54f"
      : "#ff5722";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha=1;

}


/* ==============================
   DRAW
============================== */

function draw(){

  drawBackground();

  drawRewards();

  drawTraps();

  drawBullets();

  drawBoss();

  drawPlayer();

  drawParticles();

}


/* ==============================
   LOOP
============================== */

function gameLoop(time){

  if(!running){

    draw();
    return;

  }


  const dt=
    Math.min(
      .033,
      (time-lastTime)/1000
    );


  lastTime=time;

  update(dt);

  draw();


  if(running){

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* ==============================
   MOBILE CONTROLS
============================== */

function bindHold(
  element,
  press,
  release
){

  element.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();
      press();

    }
  );


  element.addEventListener(
    "pointerup",
    e=>{

      e.preventDefault();
      release();

    }
  );


  element.addEventListener(
    "pointercancel",
    release
  );

}


bindHold(
  document.getElementById("leftBtn"),
  ()=>leftPressed=true,
  ()=>leftPressed=false
);


bindHold(
  document.getElementById("rightBtn"),
  ()=>rightPressed=true,
  ()=>rightPressed=false
);


bindHold(
  document.getElementById("shootBtn"),
  ()=>shootPressed=true,
  ()=>shootPressed=false
);


/* ==============================
   SOUND BUTTON
============================== */

document
.getElementById("soundBtn")
.addEventListener(
  "click",
  ()=>{

    unlockAudio();

    soundOn=!soundOn;

    document
    .getElementById("soundBtn")
    .textContent=
      soundOn
      ? "🔊"
      : "🔇";


    if(soundOn){

      tone(
        700,
        .12,
        "sine",
        .15,
        1000
      );

    }

  }
);


/* ==============================
   BUTTONS
============================== */

document
.getElementById("startBtn")
.addEventListener(
  "click",
  startGame
);


document
.getElementById("retryBtn")
.addEventListener(
  "click",
  startGame
);


document
.getElementById("againBtn")
.addEventListener(
  "click",
  startGame
);


/* ==============================
   INITIAL
============================== */

player=makePlayer();

boss={
  x:W/2,
  y:125,
  hp:35,
  maxHp:35,
  invincible:0,
  flash:0
};

initClouds();

draw();

</script>
